format = "[]($style)[$symbol$shlvl]($style inverted)[]($style)"

[direnv]
disabled=false
symbol = "󰌪"
style = "fg:bright-blue"
format = "[]($style)[$symbol( $loaded/$allowed)]($style inverted)[]($style)"

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "
format = "[]($style)[$symbol$percentage]($style inverted)[]($style)"

[[battery.display]]
threshold = 20
style = "fg:bright-red"
