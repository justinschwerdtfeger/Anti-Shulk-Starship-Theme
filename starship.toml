[os]
disabled = false
format = "[$symbol](inverted)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
NixOS = ""
EndeavourOS = ""
Void = ""
FreeBSD = ""
OpenBSD = "󰈺"

[directory]
format = "[ ($read_only )$path ](inverted fg:bright-blue)"
read_only = "󰌾"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
"home_symbol" = "󰋜 "

[directory.substitutions]
# "/Documents/" = "/ 󰈙 /"
# "/Downloads/" = "/  /"
# "/Music/" = "/ 󰝚 /"
# "/Pictures/" = "/  /"
# "/Developer/" = "/  /"
# "/Programming/" = "/  /"
# "/Games/" = "/ 󰊗 /"
# "/Videos/" = "/ 󰕧 /"
# "/Experiments/" = "/  /"
# "/School/" = "/ 󰑴 /"
# "/Projects/" = "/  /"
# "/Desktop/" = "/ 󰇄 /"

# Version Control Systems
[git_branch]
only_attached = false
always_show_remote = false
ignore_branches = []
symbol = ""
style = "fg:green"
format = "[]($style)[$symbol $branch(:$remote_branch) ]($style inverted)"

[git_commit]
style = "fg:green"
format = "[\\($hash$tag\\) ]($style inverted)"

[git_state]
style = "fg:green"
format = "[\\($state( $progress_current/$progress_total)\\) ]($style inverted)"

[git_metrics]
disabled = true

[git_status]
style = "fg:green"
format = "[($all_status$ahead_behind)]($style inverted)[]($style)"

[hg_branch]
disabled=true
symbol = ""
style = "fg:green"
format = "[]($style)[$symbol $branch(:$topic)]($style inverted)[]($style)"

[hg_state]
disabled=true

[pijul_channel]
disabled=true
symbol = ""
style = "fg:green"
format = "[]($style)[$symbol $channel]($style inverted)[]($style)"

[fossil_branch]
disabled=true
symbol = ""
style = "fg:green"
format = "[]($style)[$symbol $branch]($style inverted)[]($style)"

[fossil_metrics]
disabled=true

