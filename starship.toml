# System, Shell & Session
[username]
style_user = "fg:yellow"
style_root = "fg:red"
format = "[]($style)[$user]($style inverted)[]($style)"

[hostname]
ssh_only = true
ssh_symbol = "󰖩"
style = "fg:green"
format = "[]($style)[$ssh_symbol]($style inverted)[]($style)"

[localip]
disabled=false
ssh_only = true
format = "[]($style)[$localipv4]($style inverted)[]($style)"
style = "fg:green"

[time]
disabled = true

[line_break]
disabled = true

[character]
success_symbol = "[❯](bold fg:blue)"

[cmd_duration]
min_time = 100
style = "fg:bright-blue"
format = "[]($style)[$duration]($style inverted)[]($style)"

[status]
disabled = false
symbol = ""
style = "fg:red"
format = "[]($style)[$symbol $status]($style inverted)[]($style)"

[memory_usage]
disabled=true
symbol = "󰍛"
style = "fg:bright-blue"
format = "[]($style)[$symbol $ram( | $swap)]($style inverted)[]($style)"

[jobs]
symbol = "✦"
style = "fg:bright-blue"
format = "[]($style)[$symbol $number]($style inverted)[]($style)"

[sudo]
disabled=false
symbol = "󰌋"
style = "fg:bright-red"
format = "[]($style)[$symbol]($style inverted)[]($style)"

[shlvl]
disabled=true
symbol = "󰘍"
